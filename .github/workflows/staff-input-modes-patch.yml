name: Staff Input Modes Patch

on:
  push:
    branches:
      - feature/staff-input-modes

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/staff-input-modes
      - name: Apply three-state staff interaction
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/scoreforge/app/ui/ScoreStaffEditor.kt')
          text = path.read_text()

          old = '    var staffInputEnabled by rememberSaveable { mutableStateOf(initialInputEnabled) }\n'
          new = '    var staffInputMode by rememberSaveable { mutableStateOf(StaffInputMode.fromInputEnabled(initialInputEnabled)) }\n'
          if old not in text:
              raise SystemExit('staff input state anchor not found')
          text = text.replace(old, new, 1)

          old = '''                            staffInputEnabled,\n                            notationGaps,\n'''
          new = '''                            staffInputMode,\n                            notationGaps,\n'''
          if old not in text:
              raise SystemExit('tap pointer key anchor not found')
          text = text.replace(old, new, 1)

          old = '''                                onLongPress = { position ->\n                                    val geometry = staffGeometry(events, keySignatures, size.height.toFloat(), effectiveClef)\n'''
          new = '''                                onLongPress = { position ->\n                                    if (!staffInputMode.allowsDelete) return@detectTapGestures\n                                    val geometry = staffGeometry(events, keySignatures, size.height.toFloat(), effectiveClef)\n'''
          if old not in text:
              raise SystemExit('long press anchor not found')
          text = text.replace(old, new, 1)

          old = '''                                    if (!staffInputEnabled) {\n                                        ScoreTransportBus.seek(tappedBeat)\n                                        onSelectEvent(-1)\n                                        return@detectTapGestures\n                                    }\n\n                                    onAddPitch(pitchFromY(position.y, geometry, effectiveClef), tappedBeat)\n'''
          new = '''                                    if (!staffInputMode.allowsNoteEntry) {\n                                        onMoveEntryCursor(tappedBeat)\n                                        onSelectEvent(-1)\n                                        return@detectTapGestures\n                                    }\n\n                                    onAddPitch(pitchFromY(position.y, geometry, effectiveClef), tappedBeat)\n'''
          if old not in text:
              raise SystemExit('empty staff tap anchor not found')
          text = text.replace(old, new, 1)

          old = '.pointerInput(events, contentBeats, beatWidthPx, timelineLeftPx, notationGaps, effectiveClef) {'
          new = '.pointerInput(events, contentBeats, beatWidthPx, timelineLeftPx, notationGaps, effectiveClef, staffInputMode) {'
          if old not in text:
              raise SystemExit('drag pointer key anchor not found')
          text = text.replace(old, new, 1)

          old = '''                                    draggingEventIndex = nearestEditableEventIndex(\n                                        events,\n                                        position,\n                                        timelineLeftPx,\n                                        beatWidthPx,\n                                        geometry,\n                                        effectiveClef,\n                                        keySignatures,\n                                        notationGaps,\n                                    )\n                                    if (draggingEventIndex >= 0) {\n'''
          new = '''                                    val editableEventIndex = nearestEditableEventIndex(\n                                        events,\n                                        position,\n                                        timelineLeftPx,\n                                        beatWidthPx,\n                                        geometry,\n                                        effectiveClef,\n                                        keySignatures,\n                                        notationGaps,\n                                    )\n                                    draggingEventIndex =\n                                        if (staffInputMode.allowsRearrange) editableEventIndex else -1\n                                    if (draggingEventIndex >= 0) {\n'''
          if old not in text:
              raise SystemExit('drag event anchor not found')
          text = text.replace(old, new, 1)

          old = '''                if (staffInputEnabled) {\n                    ScoreForgeButton(\n                        onClick = { staffInputEnabled = false },\n                        modifier = Modifier.height(28.dp),\n                        contentPadding = PaddingValues(horizontal = 8.dp, vertical = 0.dp),\n                    ) { Text("Input On", style = MaterialTheme.typography.labelSmall) }\n                } else {\n                    ScoreForgeOutlinedButton(\n                        onClick = { staffInputEnabled = true },\n                        modifier = Modifier.height(28.dp),\n                        contentPadding = PaddingValues(horizontal = 8.dp, vertical = 0.dp),\n                        colors = ButtonDefaults.outlinedButtonColors(\n                            contentColor = Color(0xFF222222)\n                        ),\n                    ) { Text("Input Off", style = MaterialTheme.typography.labelSmall) }\n                }\n'''
          new = '''                if (staffInputMode == StaffInputMode.INPUT_ON) {\n                    ScoreForgeButton(\n                        onClick = { staffInputMode = staffInputMode.next() },\n                        modifier = Modifier.width(94.dp).height(28.dp),\n                        contentPadding = PaddingValues(horizontal = 6.dp, vertical = 0.dp),\n                    ) { Text(staffInputMode.label, style = MaterialTheme.typography.labelSmall) }\n                } else {\n                    ScoreForgeOutlinedButton(\n                        onClick = { staffInputMode = staffInputMode.next() },\n                        modifier = Modifier.width(94.dp).height(28.dp),\n                        contentPadding = PaddingValues(horizontal = 6.dp, vertical = 0.dp),\n                        colors = ButtonDefaults.outlinedButtonColors(\n                            contentColor = Color(0xFF222222)\n                        ),\n                    ) { Text(staffInputMode.label, style = MaterialTheme.typography.labelSmall) }\n                }\n'''
          if old not in text:
              raise SystemExit('input button anchor not found')
          text = text.replace(old, new, 1)

          path.write_text(text)

          build = Path('app/build.gradle.kts')
          b = build.read_text()
          if 'versionCode = 56' not in b or 'versionName = "0.2.53"' not in b:
              raise SystemExit('unexpected version before staff mode bump')
          b = b.replace('versionCode = 56', 'versionCode = 57', 1)
          b = b.replace('versionName = "0.2.53"', 'versionName = "0.2.54"', 1)
          build.write_text(b)
          PY
      - name: Commit staff input modes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/scoreforge/app/ui/ScoreStaffEditor.kt app/build.gradle.kts
          git rm .github/workflows/staff-input-modes-patch.yml
          git commit -m "Add rearrange-only staff input mode"
          git push origin HEAD:feature/staff-input-modes
