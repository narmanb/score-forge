name: Apply tempo map 0.2.40

on:
  push:
    branches: [feature/tempo-map-0.2.40]
    paths:
      - .github/workflows/apply-tempo-map-0.2.40.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tempo-map-0.2.40
          fetch-depth: 0

      - name: Apply tempo-map feature
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'{label} anchor not found in {path}')
              p.write_text(s.replace(old, new, 1))

          # Remove the temporary external-open diagnostic popup now that 0.2.39 passed phone testing.
          p = Path('app/src/main/java/com/scoreforge/app/MainActivity.kt')
          s = p.read_text()
          for line in [
              'import android.app.ActivityManager\n',
              'import android.app.AlertDialog\n',
              'import android.content.ClipData\n',
              'import android.content.ClipboardManager\n',
              'import android.content.Context\n',
              'import android.widget.Toast\n',
          ]:
              s = s.replace(line, '')
          s = re.sub(r'\n\s*if \(savedInstanceState == null\) \{\n\s*maybeShowExternalOpenDiagnostics\(intent, entryPoint = "onCreate"\)\n\s*\}\n', '\n', s, count=1)
          s = s.replace('        maybeShowExternalOpenDiagnostics(intent, entryPoint = "onNewIntent")\n', '')
          s, count = re.subn(
              r'\n    private fun maybeShowExternalOpenDiagnostics\(.*?\n    private fun requestImmersiveMode\(\)',
              '\n    private fun requestImmersiveMode()',
              s,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('MainActivity diagnostic block anchor not found')
          p.write_text(s)

          # Persist an optional project-wide tempo map while keeping BPM as the legacy/start-tempo field.
          path = 'app/src/main/java/com/scoreforge/app/music/ScoreProjectStorage.kt'
          replace_once(path,
              '    val bpm: Int = 120,\n    val cursorBeat: Float = ScoreTimeline.endBeat(events),',
              '    val bpm: Int = 120,\n    val tempoChanges: List<ScoreTempoChange> = listOf(ScoreTempoChange(0f, bpm)),\n    val cursorBeat: Float = ScoreTimeline.endBeat(events),',
              'snapshot tempo field')
          replace_once(path,
              '    fun effectiveTimeSignatures(): List<ScoreTimeSignature> =\n        ScoreTimeSignatures.normalize(timeSignatures)\n',
              '    fun effectiveTempoChanges(): List<ScoreTempoChange> =\n        ScoreTempos.normalize(tempoChanges.ifEmpty { listOf(ScoreTempoChange(0f, bpm)) })\n\n    fun effectiveTimeSignatures(): List<ScoreTimeSignature> =\n        ScoreTimeSignatures.normalize(timeSignatures)\n',
              'effective tempo helper')
          replace_once(path,
              '        append("BPM\\t").append(snapshot.bpm.coerceIn(30, 300)).append(\'\\n\')\n        append("METRONOME\\t")',
              '        append("BPM\\t").append(snapshot.effectiveTempoChanges().first().bpm).append(\'\\n\')\n        snapshot.effectiveTempoChanges().forEach { tempo ->\n            append("TEMPO_CHANGE\\t")\n                .append(tempo.startBeat).append(\'\\t\')\n                .append(tempo.bpm).append(\'\\n\')\n        }\n        append("METRONOME\\t")',
              'encode tempo map')
          replace_once(path,
              '        var bpm = 120\n        var metronomeEnabled = false',
              '        var bpm = 120\n        val tempoChanges = mutableListOf<ScoreTempoChange>()\n        var metronomeEnabled = false',
              'decode tempo list')
          replace_once(path,
              '                "BPM" -> parts.getOrNull(1)?.toIntOrNull()?.let { bpm = it.coerceIn(30, 300) }\n                "METRONOME"',
              '                "BPM" -> parts.getOrNull(1)?.toIntOrNull()?.let { bpm = it.coerceIn(30, 300) }\n                "TEMPO_CHANGE" -> decodeTempoChange(parts)?.let(tempoChanges::add)\n                "METRONOME"',
              'decode tempo rows')
          replace_once(path,
              '            events = active.events,\n            bpm = bpm,\n            cursorBeat = active.cursorBeat,',
              '            events = active.events,\n            bpm = ScoreTempos.normalize(tempoChanges.ifEmpty { listOf(ScoreTempoChange(0f, bpm)) }).first().bpm,\n            tempoChanges = ScoreTempos.normalize(tempoChanges.ifEmpty { listOf(ScoreTempoChange(0f, bpm)) }),\n            cursorBeat = active.cursorBeat,',
              'decoded snapshot tempo map')
          replace_once(path,
              '    private fun decodeTimeSignature(parts: List<String>): ScoreTimeSignature? {',
              '    private fun decodeTempoChange(parts: List<String>): ScoreTempoChange? {\n        if (parts.size < 3) return null\n        val startBeat = parts[1].toFloatOrNull()?.takeIf { it >= 0f } ?: return null\n        val bpm = parts[2].toIntOrNull()?.takeIf { it in ScoreTempos.MIN_BPM..ScoreTempos.MAX_BPM } ?: return null\n        return ScoreTempoChange(startBeat, bpm).normalized()\n    }\n\n    private fun decodeTimeSignature(parts: List<String>): ScoreTimeSignature? {',
              'tempo decoder helper')

          # Import all MIDI tempo events into the new map instead of warning and discarding all but the first.
          path = 'app/src/main/java/com/scoreforge/app/music/MidiImport.kt'
          replace_once(path,
              '        val warnings = parsed.warnings.toMutableList()\n        val bpm = resolveBpm(parsed.tempoEvents, warnings)\n        val timeSignatures = resolveTimeSignatures(',
              '        val warnings = parsed.warnings.toMutableList()\n        val tempoChanges = resolveTempos(\n            events = parsed.tempoEvents,\n            ticksPerQuarter = parsed.ticksPerQuarter,\n            warnings = warnings,\n        )\n        val bpm = tempoChanges.first().bpm\n        val timeSignatures = resolveTimeSignatures(',
              'import resolve tempos')
          replace_once(path,
              '            events = first.events,\n            bpm = bpm,\n            cursorBeat = first.cursorBeat,',
              '            events = first.events,\n            bpm = bpm,\n            tempoChanges = tempoChanges,\n            cursorBeat = first.cursorBeat,',
              'import snapshot tempo map')
          p = Path(path)
          s = p.read_text()
          old_fn = '''    private fun resolveBpm(tempoEvents: List<TempoEvent>, warnings: MutableList<String>): Int {
        if (tempoEvents.isEmpty()) return DEFAULT_BPM
        val ordered = tempoEvents.sortedBy { it.tick }
        val first = ordered.first().microsecondsPerQuarter.coerceAtLeast(1)
        val bpm = (60_000_000.0 / first.toDouble()).roundToInt().coerceIn(30, 300)
        if (ordered.map { it.microsecondsPerQuarter }.distinct().size > 1) {
            warnings += "Tempo changes are not editable yet; the first MIDI tempo ($bpm BPM) was used for the project."
        }
        return bpm
    }
'''
          new_fn = '''    private fun resolveTempos(
        events: List<TempoEvent>,
        ticksPerQuarter: Int,
        warnings: MutableList<String>,
    ): List<ScoreTempoChange> {
        if (events.isEmpty()) return listOf(ScoreTempoChange(0f, DEFAULT_BPM))

        val resolved = mutableListOf<ScoreTempoChange>()
        events.sortedBy { it.tick }
            .groupBy { it.tick }
            .forEach { (tick, atTick) ->
                val distinct = atTick.map { it.microsecondsPerQuarter }.distinct()
                val chosen = atTick.last().microsecondsPerQuarter.coerceAtLeast(1)
                val bpm = (60_000_000.0 / chosen.toDouble())
                    .roundToInt()
                    .coerceIn(ScoreTempos.MIN_BPM, ScoreTempos.MAX_BPM)
                if (distinct.size > 1) {
                    val beat = tick.toFloat() / ticksPerQuarter.toFloat()
                    warnings += "Conflicting MIDI tempos at beat ${formatBeat(beat)}; $bpm BPM was used."
                }
                resolved += ScoreTempoChange(
                    startBeat = tick.toFloat() / ticksPerQuarter.toFloat(),
                    bpm = bpm,
                )
            }
        return ScoreTempos.normalize(resolved)
    }
'''
          if old_fn not in s:
              raise SystemExit('resolveBpm block not found')
          p.write_text(s.replace(old_fn, new_fn, 1))

          # Wire tempo-map state and controls into the composer. Natural/Hold use tempo at the onset;
