          s = s.replace(
              '                    (offBeat - startBeat).coerceAtLeast(0f) * secondsPerBeat * sampleRate\n                    ).toInt().coerceAtLeast(onFrame + 1)',
              '                    ((ScoreTempos.secondsAtBeat(tempoChanges, offBeat) - startSeconds) * sampleRate)\n                    ).toInt().coerceAtLeast(onFrame + 1)',
