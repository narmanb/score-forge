          s = s.replace('        val totalSeconds = endBeat * secondsPerBeat + tailSeconds', '        val totalSeconds = ScoreTempos.secondsAtBeat(safeTempos, endBeat).toFloat() + tailSeconds', 1)
          s = s.replace(
              '                    durationBeats = end - note.startBeat,\n                    secondsPerBeat = secondsPerBeat,',
              '                    startSeconds = ScoreTempos.secondsAtBeat(safeTempos, note.startBeat).toFloat(),\n                    noteSeconds = ScoreTempos.durationSeconds(safeTempos, note.startBeat, end).toFloat(),',
