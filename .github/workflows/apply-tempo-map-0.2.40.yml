          s = s.replace('        val startSample = (note.startBeat * secondsPerBeat * sampleRate).toInt()\n        val noteSeconds = durationBeats.coerceAtLeast(0.001f) * secondsPerBeat\n        val noteSamples = (noteSeconds * sampleRate).toInt().coerceAtLeast(1)', '        val startSample = (startSeconds.coerceAtLeast(0f) * sampleRate).toInt()\n        val safeNoteSeconds = noteSeconds.coerceAtLeast(0.001f)\n        val noteSamples = (safeNoteSeconds * sampleRate).toInt().coerceAtLeast(1)', 1)
          p.write_text(s)

          # Bump build version.
          path = 'app/build.gradle.kts'
          replace_once(path,
              '        versionCode = 42\n        versionName = "0.2.39"',
