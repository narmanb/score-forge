name: Apply tempo map 0.2.40

on:
  push:
    branches:
      - feature/tempo-map-0.2.40
    paths:
      - .github/workflows/apply-tempo-map-0.2.40.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tempo-map-0.2.40
          fetch-depth: 0
      - name: Apply patch script
        run: python3 .github/scripts/apply_tempo_map_0240.py
      - name: Commit implementation
        run: |
          rm .github/workflows/apply-tempo-map-0.2.40.yml
          rm .github/scripts/apply_tempo_map_0240.py
          git config user.name "score-forge-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add editable project tempo maps"
          git push origin HEAD:feature/tempo-map-0.2.40
