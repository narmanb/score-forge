          s = s.replace('            val startFrame = (click.beat * secondsPerBeat * sampleRate).toInt()', '            val startFrame = (ScoreTempos.secondsAtBeat(safeTempos, click.beat) * sampleRate).toInt()', 1)
          s = s.replace(
