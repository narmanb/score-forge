              '        val groupBpm = if (joinsCurrentChord) activeGroup!!.bpm else tempoBpmAt(startBeat)\n        val initialWritten = if (joinsCurrentChord) activeGroup!!.currentWritten\n        else HoldDurationTiming.writtenForHoldMs(0L, groupBpm, holdDurationMode)\n',
              1,
          )
          s = s.replace(
              '                bpm = bpm,\n                eventIndices = listOf(eventIndex),\n                currentWritten = initialWritten,',
              '                bpm = groupBpm,\n                eventIndices = listOf(eventIndex),\n                currentWritten = initialWritten,',
              1,
          )
          s = s.replace(
              '                bpm = bpm,\n                eventIndices = listOf(newEventIndex),\n            )',
              '                bpm = tempoBpmAt(groupStartBeat),\n                eventIndices = listOf(newEventIndex),\n            )',
              1,
          )
          s = s.replace(
              '            tracks = tracks,\n            bpm = bpm,\n            throughBeat = ScoreTracks.endBeat(tracks),',
              '            tracks = tracks,\n            bpm = tempoChanges.first().bpm,\n            tempoChanges = tempoChanges,\n            throughBeat = ScoreTracks.endBeat(tracks),',
              1,
          )
          s = s.replace(
              '                    bpm = bpm,\n                    cursorBeat = activeCursorBeat,',
              '                    bpm = activeTempoBpm,\n                    cursorBeat = activeCursorBeat,',
              1,
          )
          s = s.replace(
              '                    onTempoDown = { bpm = (bpm - 5).coerceAtLeast(30) },\n                    onTempoUp = { bpm = (bpm + 5).coerceAtMost(300) },',
              '                    onTempoDown = {\n                        setTempoChange(\n                            ScoreTimeline.quantizeBeat(activeCursorBeat),\n                            (activeTempoBpm - 5).coerceAtLeast(ScoreTempos.MIN_BPM),\n                        )\n                    },\n                    onTempoUp = {\n                        setTempoChange(\n                            ScoreTimeline.quantizeBeat(activeCursorBeat),\n                            (activeTempoBpm + 5).coerceAtMost(ScoreTempos.MAX_BPM),\n                        )\n                    },',
              1,
          )
          s = s.replace(
              '                TimeSignatureControls(\n',
              '                TempoControls(\n                    tempoChanges = tempoChanges,\n                    cursorBeat = activeCursorBeat,\n                    onSetTempo = ::setTempoChange,\n                    onRemoveTempo = ::removeTempoChange,\n                )\n\n                TimeSignatureControls(\n',
              1,
          )
          p.write_text(s)

          # Playback engine: map beats to real time piecewise. Multi-tempo SoundFont playback is forced
          # through the existing streaming path so events can be scheduled against the tempo map.
          path = 'app/src/main/java/com/scoreforge/app/audio/ScorePlaybackEngine.kt'
          p = Path(path)
          s = p.read_text()
          s = s.replace('import com.scoreforge.app.music.ScoreNote\n', 'import com.scoreforge.app.music.ScoreNote\nimport com.scoreforge.app.music.ScoreTempoChange\nimport com.scoreforge.app.music.ScoreTempos\n', 1)
          s = s.replace(
              '        bpm: Int,\n        throughBeat: Float = ScoreTimeline.endBeat(notes),',
              '        bpm: Int,\n        tempoChanges: List<ScoreTempoChange> = listOf(ScoreTempoChange(0f, bpm)),\n        throughBeat: Float = ScoreTimeline.endBeat(notes),',
              1,
          )
          s = s.replace(
              '            bpm = bpm,\n            throughBeat = throughBeat,',
              '            bpm = bpm,\n            tempoChanges = tempoChanges,\n            throughBeat = throughBeat,',
              1,
          )
          # This is the playTracks signature (second occurrence after playScore was changed).
          sig_old = '''    fun playTracks(
        tracks: List<ScoreTrack>,
        bpm: Int,
        throughBeat: Float = ScoreTracks.endBeat(tracks),'''
          sig_new = '''    fun playTracks(
        tracks: List<ScoreTrack>,
        bpm: Int,
        tempoChanges: List<ScoreTempoChange> = listOf(ScoreTempoChange(0f, bpm)),
        throughBeat: Float = ScoreTracks.endBeat(tracks),'''
          if sig_old not in s:
              raise SystemExit('playTracks signature anchor not found')
          s = s.replace(sig_old, sig_new, 1)
          s = s.replace(
              '        val safeBpm = bpm.coerceIn(30, 300)\n        val safeThroughBeat = maxOf(',
              '        val safeTempos = ScoreTempos.normalize(\n            tempoChanges.ifEmpty { listOf(ScoreTempoChange(0f, bpm)) }\n        )\n        val safeBpm = safeTempos.first().bpm\n        val hasTempoChanges = safeTempos.size > 1\n        val safeThroughBeat = maxOf(',
              1,
          )
          s = s.replace(
              '            soundFontEngine?.hasSoundFont == true &&\n            PlaybackStreamingPolicy.shouldStream(',
              '            soundFontEngine?.hasSoundFont == true &&\n            (hasTempoChanges || PlaybackStreamingPolicy.shouldStream(',
              1,
          )
          s = s.replace(
              '                noteCount = notes.size,\n            )\n        ) {',
              '                noteCount = notes.size,\n            ))\n        ) {',
              1,
          )
          s = s.replace(
              '                bpm = safeBpm,\n                startBeat = startBeat,',
              '                bpm = safeBpm,\n                tempoChanges = safeTempos,\n                startBeat = startBeat,',
              1,
          )
          s = s.replace(
              '            var rendered = renderBestAvailableTracks(playableTracks, safeBpm, safeThroughBeat)',
              '            var rendered = renderBestAvailableTracks(playableTracks, safeBpm, safeThroughBeat, safeTempos)',
              1,
          )
          s = s.replace(
              '                    bpm = safeBpm,\n                    throughBeat = safeThroughBeat,\n                    timeSignatures = timeSignatures,',
              '                    tempoChanges = safeTempos,\n                    throughBeat = safeThroughBeat,\n                    timeSignatures = timeSignatures,',
              1,
          )
          s = s.replace(
              '            val secondsPerBeat = 60.0 / safeBpm\n            val requestedStartFrame = (startBeat * secondsPerBeat * sampleRate).toInt()',
              '            val startSeconds = ScoreTempos.secondsAtBeat(safeTempos, startBeat)\n            val requestedStartFrame = (startSeconds * sampleRate).toInt()',
              1,
          )
          s = s.replace(
              '                    val beat = startBeat + (elapsedMs / 1000.0 / secondsPerBeat).toFloat()\n                    ScoreTransportBus.progress(beat.coerceAtMost(safeThroughBeat))',
              '                    val absoluteSeconds = startSeconds + elapsedMs / 1000.0\n                    val beat = ScoreTempos.beatAtSeconds(safeTempos, absoluteSeconds)\n                    ScoreTransportBus.progress(beat.coerceAtMost(safeThroughBeat))',
              1,
          )
          s = s.replace(
              '        tracks: List<ScoreTrack>,\n        bpm: Int,\n        throughBeat: Float,\n    ): RenderedAudio {',
              '        tracks: List<ScoreTrack>,\n        bpm: Int,\n        throughBeat: Float,\n        tempoChanges: List<ScoreTempoChange>,\n    ): RenderedAudio {',
              1,
          )
          s = s.replace(
              '        if (soundFont != null && soundFont.hasSoundFont) {',
              '        if (soundFont != null && soundFont.hasSoundFont && ScoreTempos.normalize(tempoChanges).size <= 1) {',
              1,
          )
          s = s.replace(
              '                bpm = bpm,\n                throughBeat = throughBeat,\n            ),',
              '                bpm = bpm,\n                tempoChanges = tempoChanges,\n                throughBeat = throughBeat,\n            ),',
              1,
          )
          s = s.replace(
              '        playableTracks: List<ScoreTrack>,\n        bpm: Int,\n        startBeat: Float,',
              '        playableTracks: List<ScoreTrack>,\n        bpm: Int,\n        tempoChanges: List<ScoreTempoChange>,\n        startBeat: Float,',
              1,
          )
          s = s.replace('        val secondsPerBeat = 60f / bpm.coerceIn(30, 300)\n\n        thread', '        val safeTempos = ScoreTempos.normalize(tempoChanges)\n        val startSeconds = ScoreTempos.secondsAtBeat(safeTempos, startBeat)\n\n        thread', 1)
          s = s.replace(
