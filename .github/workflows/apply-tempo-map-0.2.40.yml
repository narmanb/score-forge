          path = 'app/src/main/java/com/scoreforge/app/ui/ComposerScreen.kt'
          p = Path(path)
          s = p.read_text()
          s = s.replace('import com.scoreforge.app.music.ScoreRest\n', 'import com.scoreforge.app.music.ScoreRest\nimport com.scoreforge.app.music.ScoreTempoChange\nimport com.scoreforge.app.music.ScoreTempos\n', 1)
