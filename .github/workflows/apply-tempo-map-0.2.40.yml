              '        tempoChanges: List<ScoreTempoChange>,\n    ): List<StreamingClick> {\n        val startSeconds = ScoreTempos.secondsAtBeat(tempoChanges, startBeat)\n        return ScoreMetronome.clicks(timeSignatures, throughBeat)',
              1,
