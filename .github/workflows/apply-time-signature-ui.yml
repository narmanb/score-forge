name: Apply time signature UI integration

on:
  push:
    branches:
      - feature/time-signature-ui

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/time-signature-ui
          fetch-depth: 0

      - name: Apply meter-aware editor patches
        run: python3 tools/apply_time_signature_ui.py

      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          git commit -m "Finish time signature editor UI"
          git push origin HEAD:feature/time-signature-ui
