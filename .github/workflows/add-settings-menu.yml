name: Add settings menu

on:
  push:
    branches:
      - feature/settings-menu

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/settings-menu
          fetch-depth: 0

      - name: Apply settings menu
        run: python3 tools/add_settings_menu.py

      - name: Commit settings menu
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts \
                  app/src/main/java/com/scoreforge/app/MainActivity.kt \
                  app/src/main/java/com/scoreforge/app/ui/HapticMaterialControls.kt \
                  app/src/main/java/com/scoreforge/app/ui/ScoreForgeUiFeedback.kt \
                  app/src/main/java/com/scoreforge/app/ui/ControlShapes.kt \
                  app/src/main/java/com/scoreforge/app/ui/ScoreForgeSettings.kt \
                  app/src/main/java/com/scoreforge/app/ui/ScoreForgeSettingsScreen.kt \
                  app/src/main/java/com/scoreforge/app/ui/ComposerTransformToolbar.kt \
                  app/src/main/java/com/scoreforge/app/ui/MultitouchPianoKeyboard.kt \
                  app/src/main/java/com/scoreforge/app/ui/ScoreStaffEditor.kt \
                  app/src/main/java/com/scoreforge/app/ui/PianoRollEditor.kt \
                  app/src/main/java/com/scoreforge/app/ui/ComposerScreen.kt \
                  docs/settings-0.2.48-phone-test.md
          if git diff --cached --quiet; then
            echo "No settings changes needed."
            exit 0
          fi
          git commit -m "Add persistent hybrid settings menu"
          git push origin HEAD:feature/settings-menu
