name: Apply large MIDI playback fix

on:
  push:
    branches:
      - fix/large-midi-playback
    paths:
      - tools/apply_large_midi_playback_fix.py
      - .github/workflows/apply-large-midi-playback-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/large-midi-playback
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply playback fix
        run: python tools/apply_large_midi_playback_fix.py
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts app/src/main/java/com/scoreforge/app/audio/PlaybackStreamingPolicy.kt app/src/main/java/com/scoreforge/app/audio/ScorePlaybackEngine.kt app/src/main/java/com/scoreforge/app/audio/SoundFontEngine.kt app/src/main/java/com/scoreforge/app/ui/ComposerScreen.kt app/src/test/java/com/scoreforge/app/audio/PlaybackStreamingPolicyTest.kt
          git diff --cached --quiet && exit 0
          git commit -m "Stream large score playback"
          git push
