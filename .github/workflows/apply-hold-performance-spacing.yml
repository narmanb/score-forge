name: Apply Hold performance spacing

on:
  push:
    branches: [fix/hold-performance-spacing]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/hold-performance-spacing
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply Hold timing update
        run: python tools/apply_hold_performance_spacing.py

      - name: Commit generated source
        run: |
          if git diff --quiet --exit-code && [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          git commit -m "Preserve performed attack spacing in Hold mode"
          git push origin HEAD:fix/hold-performance-spacing
