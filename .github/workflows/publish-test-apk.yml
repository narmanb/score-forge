name: Publish Test APK

on:
  push:
    branches:
      - test-apk-publisher

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified CI artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p apk
          gh run download 34097386265 --repo narmanb/score-forge --name score-forge-debug-apk --dir apk
          mv apk/app-debug.apk apk/Score-Forge-0.2.55-PR41.apk
      - name: Publish browser-download prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete score-forge-pr41-test --repo narmanb/score-forge --yes --cleanup-tag || true
          gh release create score-forge-pr41-test apk/Score-Forge-0.2.55-PR41.apk --repo narmanb/score-forge --target 11ef64c6ebcb05b91e9c54d874cd7577382f032f --prerelease --title "Score Forge 0.2.55 PR #41 Test" --notes "Phone-test APK for PR #41. Reorders the composer root toolbar to Notes, Measure, Time, Key, Tempo, Clef, Editor. Do not treat this prerelease as merged or final until device verification passes."
