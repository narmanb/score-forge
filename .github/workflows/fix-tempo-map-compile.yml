name: Fix tempo map compile

on:
  push:
    branches:
      - feature/tempo-map-0.2.40
    paths:
      - .github/workflows/fix-tempo-map-compile.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tempo-map-0.2.40
          fetch-depth: 0
      - name: Apply fixes
        run: python3 .github/scripts/fix_tempo_compile.py
      - name: Commit fixes
        run: |
          rm .github/workflows/fix-tempo-map-compile.yml
          rm .github/scripts/fix_tempo_compile.py
          git config user.name "score-forge-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix tempo-map compile errors"
          git push origin HEAD:feature/tempo-map-0.2.40
