name: Apply Score Forge 0.2.11 patch

on:
  push:
    paths:
      - '.github/workflows/apply-scoreforge-0211.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source patch
        run: python3 .github/scripts/apply_scoreforge_0211.py

      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Improve duration controls and piano roll"
          git push
