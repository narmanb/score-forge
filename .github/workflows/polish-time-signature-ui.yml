name: Polish time signature notation

on:
  push:
    branches:
      - feature/time-signature-ui

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/time-signature-ui
          fetch-depth: 0

      - name: Render meter changes as stacked notation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/scoreforge/app/ui/ScoreStaffEditor.kt')
          text = path.read_text()
          old = '''private fun DrawScope.drawTimeSignatureChange(
              signature: ScoreTimeSignature,
              timelineLeftPx: Float,
              pixelsPerBeat: Float,
              geometry: StaffGeometry,
          ) {
              val x = StaffTimelineLayout.xAtBeat(
                  signature.startBeat,
                  timelineLeftPx,
                  pixelsPerBeat,
              ) + geometry.lineSpacing * 0.38f
              drawIntoCanvas { canvas ->
                  val paint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = android.graphics.Color.rgb(32, 32, 32)
                      textAlign = Paint.Align.LEFT
                      typeface = Typeface.create(Typeface.SERIF, Typeface.BOLD)
                      textSize = geometry.lineSpacing * 0.78f
                  }
                  canvas.nativeCanvas.drawText(
                      signature.displayName,
                      x,
                      geometry.staffTop - geometry.lineSpacing * 0.34f,
                      paint,
                  )
              }
          }
          '''
          new = '''private fun DrawScope.drawTimeSignatureChange(
              signature: ScoreTimeSignature,
              timelineLeftPx: Float,
              pixelsPerBeat: Float,
              geometry: StaffGeometry,
          ) {
              val x = StaffTimelineLayout.xAtBeat(
                  signature.startBeat,
                  timelineLeftPx,
                  pixelsPerBeat,
              ) + geometry.lineSpacing * 0.58f
              drawIntoCanvas { canvas ->
                  val paint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = android.graphics.Color.rgb(32, 32, 32)
                      textAlign = Paint.Align.CENTER
                      typeface = Typeface.create(Typeface.SERIF, Typeface.BOLD)
                      textSize = geometry.lineSpacing * 0.92f
                  }
                  canvas.nativeCanvas.drawText(
                      signature.numerator.toString(),
                      x,
                      geometry.staffTop + geometry.lineSpacing * 1.62f,
                      paint,
                  )
                  canvas.nativeCanvas.drawText(
                      signature.denominator.toString(),
                      x,
                      geometry.staffTop + geometry.lineSpacing * 3.58f,
                      paint,
                  )
              }
          }
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one old meter-change renderer, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/scoreforge/app/ui/ScoreStaffEditor.kt
          git commit -m "Render time signature changes as notation"
          git push origin HEAD:feature/time-signature-ui
