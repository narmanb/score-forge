name: Apply Key-Aware Staff Input

on:
  push:
    branches: [feature/key-signatures]
    paths:
      - tools/apply_key_staff_input.py
      - .github/workflows/apply-key-staff-input.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/key-signatures
      - name: Apply key-aware staff input
        run: python tools/apply_key_staff_input.py
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/scoreforge/app/ui/ComposerScreen.kt app/src/main/java/com/scoreforge/app/ui/ScoreStaffEditor.kt
          git commit -m "Make staff entry follow the active key signature"
          git push origin HEAD:feature/key-signatures
