name: Apply chord auto and transport implementation

on:
  push:
    branches: [feature/chord-auto-transport]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: feature/chord-auto-transport

      - name: Apply patch
        run: python ci/apply_chord_auto_transport_patch.py

      - name: Commit source changes
        run: |
          rm ci/apply_chord_auto_transport_patch.py
          rm .github/workflows/apply-chord-auto-transport.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add chord auto mode and local staff transport"
          git push origin HEAD:feature/chord-auto-transport
