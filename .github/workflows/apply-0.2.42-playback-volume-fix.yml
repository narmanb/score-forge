name: Apply 0.2.42 playback and MIDI volume fix

on:
  push:
    branches: [fix/audio-tempo-markers-0.2.41]
    paths:
      - .github/workflows/apply-0.2.42-playback-volume-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/audio-tempo-markers-0.2.41
          fetch-depth: 0

      - name: Restore streaming tempo playback and fix MIDI controller import
        run: |
          git fetch origin main
          # 0.2.41's offline variable-tempo render caused heavy UI stalls on large MIDIs.
          # Restore the proven 0.2.40 streaming playback implementation while keeping
          # the 0.2.41 tempo-map UI/markers and live-preview safety fix.
          git checkout origin/main -- \
            app/src/main/java/com/scoreforge/app/audio/ScorePlaybackEngine.kt \
            app/src/main/java/com/scoreforge/app/audio/SoundFontEngine.kt

          python3 - <<'PY'
          from pathlib import Path

          midi = Path('app/src/main/java/com/scoreforge/app/music/MidiImport.kt')
          s = midi.read_text()
          old = '''        var program: Int? = null,
        var volume: Int? = null,
        var pan: Int? = null,
    )'''
          new = '''        var program: Int? = null,
        var volume: Int? = null,
        var pan: Int? = null,
        var volumeAutomated: Boolean = false,
        var panAutomated: Boolean = false,
    )'''
          if old not in s:
              raise SystemExit('TrackChannelState anchor not found')
          s = s.replace(old, new, 1)

          old = '''                volume = candidates.mapNotNull { it.volume }.firstOrNull(),
                pan = candidates.mapNotNull { it.pan }.firstOrNull(),
            )'''
          new = '''                volume = candidates.mapNotNull { it.volume }.firstOrNull(),
                pan = candidates.mapNotNull { it.pan }.firstOrNull(),
                volumeAutomated = candidates.any { it.volumeAutomated },
                panAutomated = candidates.any { it.panAutomated },
            )'''
          if old not in s:
              raise SystemExit('stateFor anchor not found')
          s = s.replace(old, new, 1)

          old = '''            val state = stateFor(group)
            val events = group.notes'''
          new = '''            val state = stateFor(group)
            if (state.volumeAutomated) {
                warnings += "MIDI channel ${channel + 1} contains volume automation; Score Forge used the initial volume ${state.volume ?: ScoreTrack.DEFAULT_VOLUME} instead of the later automation values."
            }
            if (state.panAutomated) {
                warnings += "MIDI channel ${channel + 1} contains pan automation; Score Forge used the initial pan value instead of the later automation values."
            }
            val events = group.notes'''
          if old not in s:
              raise SystemExit('group state anchor not found')
          s = s.replace(old, new, 1)

          old = '''                                7 -> state(channel).volume = value
                                10 -> state(channel).pan = value'''
          new = '''                                7 -> {
                                    val channelState = state(channel)
                                    if (channelState.volume == null) {
                                        channelState.volume = value
                                    } else if (channelState.volume != value) {
                                        channelState.volumeAutomated = true
                                    }
                                }
                                10 -> {
                                    val channelState = state(channel)
                                    if (channelState.pan == null) {
                                        channelState.pan = value
                                    } else if (channelState.pan != value) {
                                        channelState.panAutomated = true
                                    }
                                }'''
          if old not in s:
              raise SystemExit('controller anchor not found')
          s = s.replace(old, new, 1)
          midi.write_text(s)

          gradle = Path('app/build.gradle.kts')
          s = gradle.read_text()
          old = '''        versionCode = 44
        versionName = "0.2.41"'''
          new = '''        versionCode = 45
        versionName = "0.2.42"'''
          if old not in s:
              raise SystemExit('version anchor not found')
          gradle.write_text(s.replace(old, new, 1))
          PY

          cat > app/src/test/java/com/scoreforge/app/music/MidiImporterControllerAutomationTest.kt <<'EOF'
          package com.scoreforge.app.music

          import org.junit.Assert.assertEquals
          import org.junit.Assert.assertTrue
          import org.junit.Test
          import java.io.ByteArrayOutputStream

          class MidiImporterControllerAutomationTest {
              @Test
              fun usesInitialVolumeWhenMidiLaterFadesToZero() {
                  val out = ByteArrayOutputStream()
                  fun bytes(vararg values: Int) = values.forEach(out::write)
                  fun ascii(value: String) = value.forEach { out.write(it.code) }
                  fun int32(value: Int) = bytes(value ushr 24, value ushr 16, value ushr 8, value)
                  ascii("MThd"); int32(6); bytes(0, 0, 0, 1, 1, 0)
                  val track = ByteArrayOutputStream()
                  fun t(vararg values: Int) = values.forEach(track::write)
                  t(0x00, 0xB0, 0x07, 100)       // initial channel volume
                  t(0x00, 0x90, 60, 100)         // note on
                  t(0x81, 0x00, 0x80, 60, 0)     // note off after one beat
                  t(0x00, 0xB0, 0x07, 0)         // later fade/end state must not mute whole import
                  t(0x00, 0xFF, 0x2F, 0x00)
                  ascii("MTrk"); int32(track.size()); out.write(track.toByteArray())

                  val result = MidiImporter.import(out.toByteArray(), "Volume Automation Test")
                  val imported = result.snapshot.effectiveTracks().single()
                  assertEquals(100, imported.volume)
                  assertTrue(result.warnings.any { it.contains("volume automation") })
              }
          }
          EOF

      - name: Remove temporary updater and commit
        run: |
          rm .github/workflows/apply-0.2.42-playback-volume-fix.yml
          git config user.name "score-forge-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Restore smooth tempo playback and preserve initial MIDI volume"
          git push origin HEAD:fix/audio-tempo-markers-0.2.41
