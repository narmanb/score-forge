name: Apply playback rollback

on:
  push:
    branches:
      - fix/audio-tempo-markers-0.2.41

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/audio-tempo-markers-0.2.41
          fetch-depth: 0
      - name: Patch regression
        run: |
          git fetch origin main
          git checkout origin/main -- app/src/main/java/com/scoreforge/app/audio/ScorePlaybackEngine.kt app/src/main/java/com/scoreforge/app/audio/SoundFontEngine.kt
          python3 -c 'from pathlib import Path; p=Path("app/src/main/java/com/scoreforge/app/music/MidiImport.kt"); s=p.read_text(); s=s.replace("7 -> state(channel).volume = value", "7 -> if (state(channel).volume == null) state(channel).volume = value"); s=s.replace("10 -> state(channel).pan = value", "10 -> if (state(channel).pan == null) state(channel).pan = value"); p.write_text(s)'
          python3 -c 'from pathlib import Path; p=Path("app/build.gradle.kts"); s=p.read_text().replace("versionCode = 44", "versionCode = 45").replace("versionName = \"0.2.41\"", "versionName = \"0.2.42\""); p.write_text(s)'
      - name: Commit patch
        run: |
          rm .github/workflows/apply-0.2.42-playback-volume-fix.yml
          git config user.name score-forge-ci
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m "Restore smooth tempo playback and preserve initial MIDI volume"
          git push origin HEAD:fix/audio-tempo-markers-0.2.41
