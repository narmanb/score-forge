name: Apply MIDI import and track switch fix

on:
  push:
    branches:
      - fix/midi-import-track-switch
    paths:
      - tools/apply_midi_import_track_switch_fix.py
      - .github/workflows/apply-midi-import-track-switch-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/midi-import-track-switch
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python tools/apply_midi_import_track_switch_fix.py
      - name: Commit generated changes
        run: |
          git config user.name "narmanb"
          git config user.email "43427228+narmanb@users.noreply.github.com"
          git add app/build.gradle.kts \
            app/src/main/java/com/scoreforge/app/audio/ScorePlaybackEngine.kt \
            app/src/main/java/com/scoreforge/app/ui/ComposerScreen.kt \
            app/src/main/java/com/scoreforge/app/ui/SoundFontControls.kt \
            app/src/main/java/com/scoreforge/app/music/MidiImport.kt \
            app/src/test/java/com/scoreforge/app/music/MidiImporterTest.kt
          git commit -m "Improve MIDI import and playback navigation" || exit 0
          git push origin HEAD:fix/midi-import-track-switch
