name: Temporary Measure Paste Guard Patcher

on:
  push:
    branches: [feature/measure-tools]
    paths:
      - .github/workflows/measure-paste-guard.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/measure-tools

      - name: Patch paste availability
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/scoreforge/app/ui/ComposerScreen.kt')
          lines = path.read_text().splitlines()
          matches = [i for i, line in enumerate(lines) if line.strip() == 'measurePasteEnabled = measureClipboard != null,']
          if len(matches) != 1:
              raise SystemExit(f'expected one paste enabled line, found {len(matches)}')
          i = matches[0]
          indent = lines[i][:-len(lines[i].lstrip())]
          lines[i] = indent + 'measurePasteEnabled = measureClipboard?.let { ScoreMeasureEdits.canPasteAt(timeSignatures, activeCursorBeat, it) } == true,'
          path.write_text('\n'.join(lines) + '\n')
          PY
          git diff --check

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "Score Forge automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/measure-paste-guard.yml
          git add app/src/main/java/com/scoreforge/app/ui/ComposerScreen.kt
          git commit -m "Disable paste when copied onsets exceed destination measure"
          git push origin HEAD:feature/measure-tools
