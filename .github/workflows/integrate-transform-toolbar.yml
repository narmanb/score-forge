name: Integrate transform toolbar

on:
  push:
    branches:
      - feature/composer-transform-toolbar

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/composer-transform-toolbar
          fetch-depth: 0

      - name: Integrate transforming toolbar
        run: python3 tools/integrate_transform_toolbar.py

      - name: Commit generated integration
        run: |
          if git diff --quiet; then
            echo "No integration changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/scoreforge/app/ui/ComposerScreen.kt
          git commit -m "Wire transforming composer toolbar"
          git push origin HEAD:feature/composer-transform-toolbar
