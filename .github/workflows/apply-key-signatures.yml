name: Apply Score Forge Key Signatures

on:
  push:
    branches: [feature/key-signatures]
    paths:
      - tools/apply_key_signatures.py
      - .github/workflows/apply-key-signatures.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/key-signatures
      - name: Relax the two intentional repeated staff replacements
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/apply_key_signatures.py')
          text = p.read_text()
          old = '''    count = text.count(old)\n    if count != 1:\n        raise RuntimeError(f"Expected exactly one match in {path}, found {count}: {old[:120]!r}")\n    p.write_text(text.replace(old, new, 1))'''
          new = '''    count = text.count(old)\n    if count < 1:\n        raise RuntimeError(f"Expected at least one match in {path}, found {count}: {old[:120]!r}")\n    if count > 1 and not old.startswith("    val sourceY = noteY(source.midiPitch, geometry)"):\n        raise RuntimeError(f"Expected exactly one match in {path}, found {count}: {old[:120]!r}")\n    p.write_text(text.replace(old, new, 1))'''
          if old not in text:
              raise SystemExit('Could not patch helper')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Apply key-signature source changes
        run: python tools/apply_key_signatures.py
      - name: Commit generated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Add key signature import editing and notation"
          git push origin HEAD:feature/key-signatures
