name: Apply Staff Browse Fix

on:
  push:
    branches: [fix/staff-browse-pianoroll-v1]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/staff-browse-pianoroll-v1
      - name: Apply source changes
        run: python tools/apply_staff_browse_fix.py
      - name: Commit generated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/scoreforge/app/ui/ComposerScreen.kt app/src/main/java/com/scoreforge/app/ui/ScoreStaffEditor.kt app/src/main/java/com/scoreforge/app/music/NaturalEntryTiming.kt app/src/test/java/com/scoreforge/app/music/NaturalBrowseResumeTest.kt
          git commit -m "Fix Natural staff browsing and restore simple piano roll"
          git push
