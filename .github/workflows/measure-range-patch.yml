name: Measure Range Patch

on:
  push:
    branches:
      - feature/measure-range-tools

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/measure-range-tools
          fetch-depth: 0
      - name: Patch range UI and version
        run: |
          python - <<'PY'
          from pathlib import Path

          def rep(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"anchor missing in {path}: {old}")
              p.write_text(text.replace(old, new, 1))

          screen = "app/src/main/java/com/scoreforge/app/ui/ComposerScreen.kt"
          rep(screen, "    fun pasteActiveMeasure() {", "    fun copyActiveMeasureRange(measureCount: Int) {\n        measureClipboard = ScoreMeasureEdits.copyMeasures(\n            events = currentTrack().events,\n            timeSignatures = timeSignatures,\n            beat = currentTrack().cursorBeat,\n            measureCount = measureCount,\n        )\n    }\n\n    fun pasteActiveMeasure() {")
          rep(screen, "                    onPasteMeasure = ::pasteActiveMeasure,", "                    onCopyMeasureRange = ::copyActiveMeasureRange,\n                    onPasteMeasure = ::pasteActiveMeasure,")

          toolbar = "app/src/main/java/com/scoreforge/app/ui/ComposerTransformToolbar.kt"
          rep(toolbar, "import androidx.compose.runtime.mutableStateOf", "import androidx.compose.runtime.mutableIntStateOf\nimport androidx.compose.runtime.mutableStateOf")
          rep(toolbar, "    onPasteMeasure: () -> Unit = {},", "    onCopyMeasureRange: (Int) -> Unit = {},\n    onPasteMeasure: () -> Unit = {},")
          rep(toolbar, "    var section by rememberSaveable { mutableStateOf(ComposerToolbarSection.ROOT) }", "    var section by rememberSaveable { mutableStateOf(ComposerToolbarSection.ROOT) }\n    var measureRangeCount by rememberSaveable { mutableIntStateOf(2) }")
          rep(toolbar, "                ComposerSubmenuButton(label = \"Copy\", onClick = onCopyMeasure)", "                ComposerSubmenuButton(label = \"Copy\", onClick = onCopyMeasure)\n                ComposerSubmenuButton(\n                    label = \"Range −\",\n                    onClick = { measureRangeCount = (measureRangeCount - 1).coerceAtLeast(2) },\n                    enabled = measureRangeCount > 2,\n                )\n                Text(\"$measureRangeCount measures\", style = MaterialTheme.typography.bodySmall)\n                ComposerSubmenuButton(\n                    label = \"Range +\",\n                    onClick = { measureRangeCount = (measureRangeCount + 1).coerceAtMost(16) },\n                    enabled = measureRangeCount < 16,\n                )\n                ComposerSubmenuButton(\n                    label = \"Copy Range\",\n                    onClick = { onCopyMeasureRange(measureRangeCount) },\n                )")

          gradle = "app/build.gradle.kts"
          rep(gradle, "        versionCode = 53", "        versionCode = 54")
          rep(gradle, "        versionName = \"0.2.50\"", "        versionName = \"0.2.51\"")

          Path(".github/workflows/measure-range-patch.yml").unlink()
          PY
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire multi-measure range copy UI"
          git push origin HEAD:feature/measure-range-tools
