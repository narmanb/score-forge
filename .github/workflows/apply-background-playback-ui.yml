name: Apply background playback UI integration

on:
  push:
    branches:
      - feature/background-playback-0.2.43

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/background-playback-0.2.43
          fetch-depth: 0

      - name: Apply UI patch
        run: python3 ci/patch_background_playback.py

      - name: Commit patch
        run: |
          rm .github/workflows/apply-background-playback-ui.yml
          rm ci/patch_background_playback.py
          git config user.name "score-forge-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Wire composer into foreground media playback"
          git push origin HEAD:feature/background-playback-0.2.43
