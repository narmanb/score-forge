name: Apply Score Forge 0.2.17

on:
  push:
    branches:
      - feature/metronome-and-launcher-icon

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/metronome-and-launcher-icon

      - name: Apply 0.2.17 source changes
        run: python tools/apply_0_2_17.py

      - name: Commit generated source changes
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          git commit -m "Add meter-aware metronome and launcher icon wiring"
          git push origin HEAD:feature/metronome-and-launcher-icon
