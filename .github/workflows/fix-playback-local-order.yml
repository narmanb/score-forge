name: Fix playback local ordering

on:
  push:
    branches:
      - feature/clefs-and-staff-gesture-fixes
    paths:
      - tools/fix_playback_local_order.py
      - .github/workflows/fix-playback-local-order.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/clefs-and-staff-gesture-fixes
          fetch-depth: 0
      - name: Reorder local function
        run: python tools/fix_playback_local_order.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/scoreforge/app/ui/ComposerScreen.kt
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Fix playback entry-session ordering"
            git push origin HEAD:feature/clefs-and-staff-gesture-fixes
          fi
