name: Fix chord mode visibility

on:
  push:
    branches: [feature/chord-auto-transport]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: feature/chord-auto-transport

      - name: Apply visibility fix
        run: python ci/fix_chord_mode_visibility.py

      - name: Commit source change
        run: |
          rm ci/fix_chord_mode_visibility.py
          rm .github/workflows/fix-chord-mode-visibility.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix chord mode visibility"
          git push origin HEAD:feature/chord-auto-transport
