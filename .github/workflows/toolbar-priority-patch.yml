name: Toolbar Priority Patch

on:
  push:
    branches:
      - feature/toolbar-priority-order

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/toolbar-priority-order
      - name: Reorder root toolbar
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/scoreforge/app/ui/ComposerTransformToolbar.kt')
          text = path.read_text()
          old = '''            ComposerToolbarSection.ROOT -> {
                ComposerToolbarButton(
                    label = "Tempo ${activeTempo.bpm}",
                    onClick = { section = ComposerToolbarSection.TEMPO },
                )
                ComposerToolbarButton(
                    label = "Time ${activeTime.displayName}",
                    onClick = { section = ComposerToolbarSection.TIME },
                )
                ComposerToolbarButton(
                    label = "Key ${activeKey.displayName}",
                    onClick = { section = ComposerToolbarSection.KEY },
                )
                ComposerToolbarButton(
                    label = "Clef ${clefMode.displayName}",
                    onClick = { section = ComposerToolbarSection.CLEF },
                )
                ComposerToolbarButton(
                    label = "Notes ${selectedDuration.displayName}${if (dotted) " •" else ""}",
                    onClick = { section = ComposerToolbarSection.NOTES },
                )
                ComposerToolbarButton(
                    label = if (editorMode == ScoreEditorMode.STAFF) "Editor Staff" else "Editor Piano Roll",
                    onClick = { section = ComposerToolbarSection.EDITOR },
                )
                ComposerToolbarButton(
                    label = "Measure ${measureNumber.coerceAtLeast(1)}",
                    onClick = { section = ComposerToolbarSection.MEASURE },
                )
            }
'''
          new = '''            ComposerToolbarSection.ROOT -> {
                ComposerToolbarButton(
                    label = "Notes ${selectedDuration.displayName}${if (dotted) " •" else ""}",
                    onClick = { section = ComposerToolbarSection.NOTES },
                )
                ComposerToolbarButton(
                    label = "Measure ${measureNumber.coerceAtLeast(1)}",
                    onClick = { section = ComposerToolbarSection.MEASURE },
                )
                ComposerToolbarButton(
                    label = "Time ${activeTime.displayName}",
                    onClick = { section = ComposerToolbarSection.TIME },
                )
                ComposerToolbarButton(
                    label = "Key ${activeKey.displayName}",
                    onClick = { section = ComposerToolbarSection.KEY },
                )
                ComposerToolbarButton(
                    label = "Tempo ${activeTempo.bpm}",
                    onClick = { section = ComposerToolbarSection.TEMPO },
                )
                ComposerToolbarButton(
                    label = "Clef ${clefMode.displayName}",
                    onClick = { section = ComposerToolbarSection.CLEF },
                )
                ComposerToolbarButton(
                    label = if (editorMode == ScoreEditorMode.STAFF) "Editor Staff" else "Editor Piano Roll",
                    onClick = { section = ComposerToolbarSection.EDITOR },
                )
            }
'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one root toolbar block, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit toolbar order
        run: |
          git config user.name "narmanb"
          git config user.email "43427228+narmanb@users.noreply.github.com"
          git rm .github/workflows/toolbar-priority-patch.yml
          git add app/src/main/java/com/scoreforge/app/ui/ComposerTransformToolbar.kt
          git commit -m "Prioritize composer toolbar by editing frequency"
          git push origin HEAD:feature/toolbar-priority-order
