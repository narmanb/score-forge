name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Fetch verified starter instruments
        run: |
          mkdir -p app/src/main/assets/soundfonts
          curl --fail --location --retry 3 \
            --output app/src/main/assets/soundfonts/FluidR3Mono_GM.sf3 \
            https://raw.githubusercontent.com/musescore/MuseScore/2.1/share/sound/FluidR3Mono_GM.sf3
          ACTUAL_BLOB="$(git hash-object app/src/main/assets/soundfonts/FluidR3Mono_GM.sf3)"
          EXPECTED_BLOB="555bf79687570ad7ea9d4aba6cb5bfbc1724cdb2"
          test "$ACTUAL_BLOB" = "$EXPECTED_BLOB" || {
            echo "Starter SoundFont integrity check failed: $ACTUAL_BLOB" >&2
            exit 1
          }

      - name: Install stable development signing key
        run: |
          mkdir -p "$HOME/.config/.android"
          base64 --decode ci/score-forge-dev.keystore.b64 > "$HOME/.config/.android/debug.keystore"
          chmod 600 "$HOME/.config/.android/debug.keystore"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Report debug signing source
        run: gradle :app:signingReport --stacktrace

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: score-forge-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
