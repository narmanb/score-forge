name: Refine settings gear

on:
  push:
    branches:
      - feature/settings-menu
    paths:
      - tools/refine_settings_gear.py
      - .github/workflows/refine-settings-gear.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/settings-menu
      - name: Apply settings gear refinement
        run: python tools/refine_settings_gear.py
      - name: Commit refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/scoreforge/app/ui/ControlShapes.kt
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Refine settings gear presentation"
            git push origin HEAD:feature/settings-menu
          fi
