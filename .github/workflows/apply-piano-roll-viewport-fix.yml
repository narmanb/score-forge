name: Apply Piano Roll Viewport Fix

on:
  push:
    branches: [fix/piano-roll-viewport]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/piano-roll-viewport
      - name: Apply source changes
        run: python tools/apply_piano_roll_viewport_fix.py
      - name: Commit generated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/scoreforge/app/ui/PianoRollEditor.kt app/build.gradle.kts
          git commit -m "Fix piano roll virtual canvas sizing"
          git push
