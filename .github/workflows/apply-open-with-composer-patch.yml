name: Apply Open With Composer Patch

on:
  push:
    branches: [feature/android-open-with]
    paths:
      - .github/workflows/apply-open-with-composer-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/android-open-with
          fetch-depth: 0

      - name: Patch ComposerScreen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/scoreforge/app/ui/ComposerScreen.kt')
          s = p.read_text()
          old = 'import com.scoreforge.app.audio.LiveInstrumentBus\n'
          new = 'import com.scoreforge.app.ExternalOpenRequest\n' + old
          if 'import com.scoreforge.app.ExternalOpenRequest\n' not in s:
              if old not in s:
                  raise SystemExit('Composer import anchor not found')
              s = s.replace(old, new, 1)

          old = '@Composable\nfun ScoreForgeComposerScreen() {'
          new = '''@Composable
          fun ScoreForgeComposerScreen(
              externalOpenRequest: ExternalOpenRequest? = null,
              onExternalOpenConsumed: (ExternalOpenRequest) -> Unit = {},
          ) {'''.replace('          ', '')
          if old not in s:
              raise SystemExit('Composer signature anchor not found')
          s = s.replace(old, new, 1)

          old = '''    MaterialTheme(colorScheme = darkColorScheme()) {
              Surface(modifier = Modifier.fillMaxSize()) {'''.replace('          ', '')
          new = '''    MaterialTheme(colorScheme = darkColorScheme()) {
              ExternalOpenHandler(
                  request = externalOpenRequest.takeIf { draftLoaded },
                  onOpenProject = ::openProject,
                  onConsumed = onExternalOpenConsumed,
              )

              Surface(modifier = Modifier.fillMaxSize()) {'''.replace('          ', '')
          if old not in s:
              raise SystemExit('Composer MaterialTheme anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Remove temporary updater and commit
        run: |
          rm .github/workflows/apply-open-with-composer-patch.yml
          git config user.name "score-forge-ci"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/scoreforge/app/ui/ComposerScreen.kt .github/workflows/apply-open-with-composer-patch.yml
          git commit -m "Wire external open requests into composer"
          git push origin HEAD:feature/android-open-with
