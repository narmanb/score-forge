name: Apply Score Forge 0.2.10 patch

on:
  push:
    paths:
      - tools/apply_scoreforge_0210.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source patch
        run: python3 tools/apply_scoreforge_0210.py
      - name: Commit patched source
        run: |
          rm tools/apply_scoreforge_0210.py
          rm .github/workflows/apply-scoreforge-0210.yml
          git config user.name "score-forge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && { echo "Patch produced no changes"; exit 1; } || true
          git commit -m "Fix composer input and editing controls"
          git push
