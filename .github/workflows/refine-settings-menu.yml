name: Refine settings menu

on:
  push:
    branches:
      - feature/settings-menu

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/settings-menu
          fetch-depth: 0
      - name: Apply settings refinements
        run: python3 tools/refine_settings_menu.py
      - name: Commit refinements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/scoreforge/app/ui/EditorModeControls.kt \
                  app/src/main/java/com/scoreforge/app/ui/ScoreForgeSettings.kt \
                  app/src/main/java/com/scoreforge/app/ui/MultitouchPianoKeyboard.kt \
                  app/src/main/java/com/scoreforge/app/ui/ComposerScreen.kt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refine settings behavior"
          git push origin HEAD:feature/settings-menu
