name: Apply hold feedback update

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feature/hold-feedback'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply generated source update
        run: python tools/apply_hold_feedback.py

      - name: Commit generated source
        run: |
          if git diff --quiet --exit-code && [ -z "$(git status --porcelain)" ]; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app tools
          git commit -m "Add Hold entry mode and tactile command feedback"
          git push origin HEAD:${{ github.head_ref }}
