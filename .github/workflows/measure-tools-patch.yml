name: Temporary Measure Tools Patcher

on:
  push:
    branches: [feature/measure-tools]
    paths:
      - .github/workflows/measure-tools-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/measure-tools

      - name: Patch composer measure tools
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def find_unique(lines, predicate, label):
              matches = [i for i, line in enumerate(lines) if predicate(line)]
              if len(matches) != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match, found {len(matches)}")
              return matches[0]

          screen_path = Path('app/src/main/java/com/scoreforge/app/ui/ComposerScreen.kt')
          lines = screen_path.read_text().splitlines()

          i = find_unique(lines, lambda s: s.strip() == 'import com.scoreforge.app.music.ScoreKeySignatures', 'measure import anchor')
          lines[i + 1:i + 1] = [
              'import com.scoreforge.app.music.ScoreMeasureClipboard',
              'import com.scoreforge.app.music.ScoreMeasureEdits',
          ]

          i = find_unique(lines, lambda s: s.strip() == 'var mixerGestureHistoryRecorded by remember { mutableStateOf(false) }', 'clipboard state anchor')
          indent = lines[i][:-len(lines[i].lstrip())]
          lines.insert(i + 1, indent + 'var measureClipboard by remember { mutableStateOf<ScoreMeasureClipboard?>(null) }')

          i = find_unique(lines, lambda s: s.strip() == 'fun clearActiveTrack() {', 'clear track anchor')
          indent = lines[i][:-len(lines[i].lstrip())]
          block = [
              indent + 'fun copyActiveMeasure() {',
              indent + '    measureClipboard = ScoreMeasureEdits.copyMeasure(',
              indent + '        events = currentTrack().events,',
              indent + '        timeSignatures = timeSignatures,',
              indent + '        beat = currentTrack().cursorBeat,',
              indent + '    )',
              indent + '}',
              '',
              indent + 'fun pasteActiveMeasure() {',
              indent + '    val clipboard = measureClipboard ?: return',
              indent + '    stopPlayback()',
              indent + '    stopLiveRecording()',
              indent + '    cancelNaturalEntryGroup()',
              indent + '    LiveInstrumentBus.allNotesOff()',
              indent + '    val track = currentTrack()',
              indent + '    recordBeforeScoreEdit()',
              indent + '    val updatedEvents = ScoreMeasureEdits.pasteReplace(',
              indent + '        events = track.events,',
              indent + '        timeSignatures = timeSignatures,',
              indent + '        destinationBeat = track.cursorBeat,',
              indent + '        clipboard = clipboard,',
              indent + '    )',
              indent + '    replaceActiveTrack { it.copy(events = updatedEvents) }',
              indent + '    selectedEventIndex = -1',
              indent + '    syncHistoryButtons()',
              indent + '}',
              '',
              indent + 'fun duplicateActiveMeasure(copies: Int) {',
              indent + '    stopPlayback()',
              indent + '    stopLiveRecording()',
              indent + '    cancelNaturalEntryGroup()',
              indent + '    LiveInstrumentBus.allNotesOff()',
              indent + '    val track = currentTrack()',
              indent + '    recordBeforeScoreEdit()',
              indent + '    val updatedEvents = ScoreMeasureEdits.duplicateMeasure(',
              indent + '        events = track.events,',
              indent + '        timeSignatures = timeSignatures,',
              indent + '        beat = track.cursorBeat,',
              indent + '        copies = copies,',
              indent + '    )',
              indent + '    val newCursorBeat = ScoreMeasureEdits.duplicateCursorBeat(',
              indent + '        timeSignatures = timeSignatures,',
              indent + '        beat = track.cursorBeat,',
              indent + '        copies = copies,',
              indent + '    )',
              indent + '    replaceActiveTrack {',
              indent + '        it.copy(',
              indent + '            events = updatedEvents,',
              indent + '            cursorBeat = newCursorBeat,',
              indent + '        )',
              indent + '    }',
              indent + '    selectedEventIndex = -1',
              indent + '    syncHistoryButtons()',
              indent + '}',
              '',
          ]
          lines[i:i] = block

          i = find_unique(lines, lambda s: s.strip() == 'showPianoKeyboard = !showPianoKeyboard', 'toolbar call anchor')
          close_lambda = i + 1
          if lines[close_lambda].strip() != '},':
              raise SystemExit('toolbar call anchor: lambda close not found')
          call_close = close_lambda + 1
          if lines[call_close].strip() != ')':
              raise SystemExit('toolbar call anchor: call close not found')
          arg_indent = lines[close_lambda][:-len(lines[close_lambda].lstrip())]
          callbacks = [
              arg_indent + 'measurePasteEnabled = measureClipboard != null,',
              arg_indent + 'onCopyMeasure = ::copyActiveMeasure,',
              arg_indent + 'onPasteMeasure = ::pasteActiveMeasure,',
              arg_indent + 'onDuplicateMeasure = { duplicateActiveMeasure(1) },',
              arg_indent + 'onDuplicateMeasure2 = { duplicateActiveMeasure(2) },',
              arg_indent + 'onDuplicateMeasure4 = { duplicateActiveMeasure(4) },',
              arg_indent + 'onDuplicateMeasure8 = { duplicateActiveMeasure(8) },',
          ]
          lines[call_close:call_close] = callbacks
          screen_path.write_text('\n'.join(lines) + '\n')

          toolbar_path = Path('app/src/main/java/com/scoreforge/app/ui/ComposerTransformToolbar.kt')
          lines = toolbar_path.read_text().splitlines()
          i = find_unique(lines, lambda s: s.strip() == 'onTogglePianoKeyboard: () -> Unit,', 'toolbar signature anchor')
          indent = lines[i][:-len(lines[i].lstrip())]
          lines[i + 1:i + 1] = [
              indent + 'measurePasteEnabled: Boolean = false,',
              indent + 'onCopyMeasure: () -> Unit = {},',
              indent + 'onPasteMeasure: () -> Unit = {},',
              indent + 'onDuplicateMeasure: () -> Unit = {},',
              indent + 'onDuplicateMeasure2: () -> Unit = {},',
              indent + 'onDuplicateMeasure4: () -> Unit = {},',
              indent + 'onDuplicateMeasure8: () -> Unit = {},',
          ]

          i = find_unique(lines, lambda s: 'Copy / paste / duplicate tools go here next' in s, 'measure placeholder')
          indent = lines[i][:-len(lines[i].lstrip())]
          lines[i:i + 1] = [
              indent + 'ComposerSubmenuButton(label = "Copy", onClick = onCopyMeasure)',
              indent + 'ComposerSubmenuButton(',
              indent + '    label = "Paste",',
              indent + '    onClick = onPasteMeasure,',
              indent + '    enabled = measurePasteEnabled,',
              indent + ')',
              indent + 'ComposerSubmenuButton(label = "Duplicate", onClick = onDuplicateMeasure)',
              indent + 'ComposerSubmenuButton(label = "×2", onClick = onDuplicateMeasure2)',
              indent + 'ComposerSubmenuButton(label = "×4", onClick = onDuplicateMeasure4)',
              indent + 'ComposerSubmenuButton(label = "×8", onClick = onDuplicateMeasure8)',
          ]
          toolbar_path.write_text('\n'.join(lines) + '\n')

          gradle_path = Path('app/build.gradle.kts')
          gradle = gradle_path.read_text()
          old = '        versionCode = 52\n        versionName = "0.2.49"\n'
          new = '        versionCode = 53\n        versionName = "0.2.50"\n'
          if gradle.count(old) != 1:
              raise SystemExit('version bump: expected exactly 1 match')
          gradle_path.write_text(gradle.replace(old, new, 1))
          PY

      - name: Check patch
        run: git diff --check

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "Score Forge automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/measure-tools-patch.yml
          git add app/build.gradle.kts app/src/main/java/com/scoreforge/app/ui/ComposerScreen.kt app/src/main/java/com/scoreforge/app/ui/ComposerTransformToolbar.kt
          git commit -m "Wire measure tools into composer"
          git push origin HEAD:feature/measure-tools
