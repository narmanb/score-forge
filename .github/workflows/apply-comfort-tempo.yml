name: Apply Comfort Tempo Integration

on:
  push:
    branches: [feature/comfort-tempo]
    paths:
      - tools/apply_comfort_tempo.py
      - .github/workflows/apply-comfort-tempo.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/comfort-tempo
      - name: Apply Comfort Tempo source changes
        run: python tools/apply_comfort_tempo.py
      - name: Commit generated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Add Comfort Tempo and portrait staff scrolling"
          git push origin HEAD:feature/comfort-tempo
