name: Apply clef and staff fixes

on:
  push:
    branches:
      - feature/clefs-and-staff-gesture-fixes
    paths:
      - tools/apply_clef_staff_fixes.py
      - .github/workflows/apply-clef-staff-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/clefs-and-staff-gesture-fixes
          fetch-depth: 0
      - name: Apply patch
        run: python tools/apply_clef_staff_fixes.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add clef modes and improve staff gesture routing"
            git push origin HEAD:feature/clefs-and-staff-gesture-fixes
          fi
