name: Refine Measure Paste

on:
  push:
    branches:
      - feature/measure-range-tools
    paths:
      - .github/workflows/refine-measure-paste.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/measure-range-tools
          fetch-depth: 0
      - name: Apply measure paste refinement
        run: python3 -c "import base64; exec(base64.b64decode(''))"
      - name: Commit refined measure tools
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine measure copy and paste UI"
          git push origin HEAD:feature/measure-range-tools
