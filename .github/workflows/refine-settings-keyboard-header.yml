name: Refine settings keyboard and header

on:
  push:
    branches:
      - feature/settings-menu
    paths:
      - tools/refine_settings_keyboard_header.py
      - .github/workflows/refine-settings-keyboard-header.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/settings-menu
          fetch-depth: 0
      - name: Apply refinements
        run: python3 tools/refine_settings_keyboard_header.py
      - name: Commit refinements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/scoreforge/app/ui/ScoreForgeSettings.kt \
                  app/src/main/java/com/scoreforge/app/ui/ScoreForgeSettingsScreen.kt \
                  app/src/main/java/com/scoreforge/app/ui/MultitouchPianoKeyboard.kt \
                  app/src/main/java/com/scoreforge/app/ui/ComposerScreen.kt \
                  docs/settings-0.2.48-phone-test.md
          git commit -m "Refine keyboard labels and settings button"
          git push origin feature/settings-menu
