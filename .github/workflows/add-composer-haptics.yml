name: Add composer haptics

on:
  push:
    branches:
      - feature/composer-haptics

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/composer-haptics
          fetch-depth: 0

      - name: Apply composer haptics
        run: python3 tools/add_composer_haptics.py

      - name: Commit haptics changes
        run: |
          if git diff --quiet && git status --porcelain | grep -q '^??' ; then
            :
          elif git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No haptics changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts \
                  app/src/main/java/com/scoreforge/app/ui/ControlShapes.kt \
                  app/src/main/java/com/scoreforge/app/ui/HapticMaterialControls.kt \
                  app/src/main/java/com/scoreforge/app/ui/ComposerScreen.kt \
                  app/src/main/java/com/scoreforge/app/ui/ProjectFileControls.kt \
                  app/src/main/java/com/scoreforge/app/ui/TrackControls.kt \
                  app/src/main/java/com/scoreforge/app/ui/SoundFontControls.kt \
                  app/src/main/java/com/scoreforge/app/ui/ScoreStaffEditor.kt
          git commit -m "Add consistent composer haptic feedback"
          git push origin HEAD:feature/composer-haptics
